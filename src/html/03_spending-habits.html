<section class="view" id="view-spending-habits">
  <div class="page-heading">
    <div>
      <div class="eyebrow">
        TENDENCIAS PERSONALES
      </div>
      <h1>
        Hábitos de gasto
      </h1>
      <p>
        Compara tus gastos por categoría con el mes anterior e identifica dónde aumentaron.
      </p>
    </div>
    <div class="habits-month-control">
      <label for="habitsMonth">
        Mes a analizar
      </label>
      <input id="habitsMonth" type="month">
    </div>
  </div>
  <div id="habitsSummary" class="habits-summary-grid">
  </div>
  <div class="panel habits-panel">
    <div class="panel-heading">
      <div>
        <h2>
          Comparación por categoría
        </h2>
        <p id="habitsSubtitle">
          Gasto del mes seleccionado frente al mes anterior.
        </p>
      </div>
      <span class="panel-tag">
        MES A MES
      </span>
    </div>
    <div id="habitsCategories" class="habits-category-list">
    </div>
  </div>
  <div class="panel habits-insights-panel">
    <div class="panel-heading">
      <div>
        <h2>
          Lo que conviene revisar
        </h2>
        <p>
          Las categorías con mayor aumento aparecen primero.
        </p>
      </div>
    </div>
    <div id="habitsInsights" class="habits-insights-list">
    </div>
  </div>
</section>
