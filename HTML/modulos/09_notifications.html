<section class="view" id="view-notifications">
  <div class="page-heading">
    <div>
      <div class="eyebrow">
        ACTIVIDAD DE TU CUENTA
      </div>
      <h1>
        Notificaciones
      </h1>
      <p>
        Historial de cambios importantes en tus finanzas.
      </p>
    </div>
    <div class="notification-page-actions">
      <button class="btn btn-outline" id="markAllNotificationsRead">
        Marcar todo como leído
      </button>
      <button class="btn btn-soft" id="clearReadNotifications">
        Eliminar leídas
      </button>
    </div>
  </div>
  <div class="panel notifications-panel">
    <div class="notifications-toolbar">
      <div>
        <h2>
          Centro de notificaciones
        </h2>
        <p id="notificationsSummary">
          Tus novedades aparecerán aquí.
        </p>
      </div>
      <span class="panel-tag" id="notificationUnreadTag">
        0 PENDIENTES
      </span>
    </div>
    <div id="notificationsList" class="notifications-list">
    </div>
  </div>
</section>
